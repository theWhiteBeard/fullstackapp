<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Employee Information</h1>
    <p class="subtitle">Sign in to continue</p>

    <label for="username">Username</label>
    <input
      id="username"
      type="text"
      formControlName="username"
      autocomplete="username"
      placeholder="admin"
    />
    <small
      class="field-error"
      *ngIf="form.controls.username.touched && form.controls.username.invalid"
    >
      Username is required.
    </small>

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      placeholder="••••••••"
    />
    <small
      class="field-error"
      *ngIf="form.controls.password.touched && form.controls.password.invalid"
    >
      Password is required.
    </small>

    <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="hint">Try <code>admin</code> / <code>admin123</code></p>
  </form>
</div>
